name: burrow
description: >-
  手机上的 LLM 客户端：平时聊天，勾上「终端模式」就变成能在可回滚
  Linux 沙箱里干活的 Agent。发行版 rootfs + proot 隔离 + Flutter UI。

# Apache-2.0，见 LICENSE。第三方组件（proot / talloc / pty.c）
# 保留各自的许可证，见 THIRD_PARTY.md。
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 终端模拟与渲染。纯 Dart 实现，接原生 pty 的字节流。
  # 不用 termux 的 TerminalView（Android View）—— 见 docs/ARCHITECTURE.md §3。
  xterm: ^4.0.0

  # SnapshotStore 的 content-addressed 对象名；
  # DistroManager 校验下载的 rootfs
  crypto: ^3.0.3

  # 数据库列的 AES-GCM 加密（见 data/db_cipher.dart）。
  # 纯 Dart —— 这一点是刻意的：SQLCipher 那条路要原生库，而桌面上没有
  # Windows 版，等于整套数据库测试都跑不了。宁可范围窄一点，也不能
  # 交一个自己验证不了的加密改动。
  pointycastle: ^3.9.1
  # AccumulatorSink —— 分块算 sha256，130MB 的 rootfs 不整包进内存
  convert: ^3.1.1

  path: ^1.9.0
  path_provider: ^2.1.3

  # 历史与检查点的持久化
  sqflite: ^2.3.3

  # LLM 流式响应
  http: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: 10.3.1
  flutter_markdown_plus: ^1.0.12
  # Debian 官方 rootfs 使用 tar.xz；流式解成临时 tar 后复用安全 tar 解包器。
  archive: ^4.0.9

  # 选图。**不用它的 maxWidth/imageQuality** —— 那会让平台层重新编码，
  # GIF 进去出来就是一张静态 JPEG。缩放和编码自己来，见 image_transcode.dart。
  image_picker: ^1.1.2

  # 只为了 encodeJpg：`dart:ui` 自带 PNG 编码器但不会编 JPEG，
  # 而照片必须留在 JPEG（转 PNG 会大接近一倍）。解码仍然走平台解码器 ——
  # 纯 Dart 的解不开 HEIC。
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    # 最小 bootstrap（bash/coreutils/proot/git/python）。
    # 按 ABI 分开打包，构建时只保留目标 ABI 那一份，否则 APK 会大一倍。
    - assets/bootstrap/
    # 模型能力快照（models.dev）。随包带一份是因为手机上第一次配渠道时
    # 多半还没联网拉到，而那正是最需要它的时刻。
    # 用 tool/generate_model_snapshot.dart 重新生成。
    - assets/model_registry.json
  shaders:
    # 输入框那块液态玻璃的边缘折射。见 lib/src/ui/liquid_glass.dart。
    - shaders/liquid_glass.frag
