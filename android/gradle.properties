# Kotlin 增量编译在本项目的 Windows 构建上必然失败：
#   Could not close incremental caches in build/shared_preferences_android/
#   kotlin/compileDebugKotlin/cacheable/caches-jvm/jvm/kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
# 删缓存、停 daemon、改 in-process 策略都不管用，加上这一条才过。
# 报错落在插件模块（shared_preferences_android）上，和本项目的 Kotlin 代码无关。
#
# 代价可以忽略：整个项目的 Kotlin 只有 app 模块下的两个文件，全量编也是秒级。
kotlin.incremental=false
